

server:
  port: 8889

ribbon:
  ConnectTimeout: 3000  # 连接 B 服务的超时时间，单位是毫秒
  ReadTimeout: 30000    # 读取 B 服务响应的超时时间，单位是毫秒

management:
  endpoints:
    web:
      exposure:
        include: "*" # 启用所有端点（也可只启用部分，如 health, metrics）
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    enable:
      all: true
    web:
      server:
        request:
          autotime:
            enabled: true

spring:
  datasource:
    url: jdbc:mysql://localhost:33062/log_db?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: Win2025!
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 如果你使用 druid 数据源
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.log.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印 SQL



